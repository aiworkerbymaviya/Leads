name: Pro Indian Client Lead & Auto-Mailer Bot

on:
  schedule:
    # Daily Subah 9:00 AM IST (UTC 3:30 AM) automatically chalega
    - cron: '30 3 * * *'
  workflow_dispatch: # Manual "Run workflow" button enabled

jobs:
  run-lead-hunter:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git commit aur push karne ki permission

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 1. Run Lead Generator Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python search.py

      - name: 2. Send Test Preview Email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python test_mailer.py

      - name: 3. Run Auto Mailer for All Leads
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python mailer.py

      - name: 4. Commit Updated Files & History to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Lead Hunter Automation"
          git add leads.csv leads.json sent_leads.json
          git diff-index --quiet HEAD || git commit -m "Auto-update: Fresh Leads & Sent History"
          git push
