name: TargetData Pro B2B Auto-Mailer Bot

on:
  workflow_dispatch: # Direct Manual Trigger

jobs:
  run-b2b-mailer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run TargetData Pro Auto Mailer
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python mailer.py

      - name: Commit Sent History to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TargetData Pro Mailer"
          git add sent_leads.json
          git diff-index --quiet HEAD || git commit -m "Auto-update: Sent History Tracker"
          git push
