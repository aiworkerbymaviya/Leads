name: Pro Indian Client Lead Bot

on:
  schedule:
    # Runs daily at 9:00 AM IST (UTC 3:30 AM)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  run-lead-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Lead Generator Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python search.py

      - name: Commit Updated Leads to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Lead Hunter Automation"
          git add leads.csv leads.json
          git diff-index --quiet HEAD || git commit -m "Auto-update: Fresh Indian Leads added"
          git push

      - name: Upload Leads as Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: indian-tech-leads
          path: |
            leads.csv
            leads.json
