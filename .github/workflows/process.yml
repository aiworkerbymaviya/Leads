name: LeadFinder

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install osmium

      - name: Download India OSM
        run: |
          wget -O india.osm.pbf \
            https://download.geofabrik.de/asia/india-latest.osm.pbf

      - name: Verify Download
        run: |
          ls -lh india.osm.pbf
          file india.osm.pbf

      - name: Run LeadFinder
        run: |
          python app.py
