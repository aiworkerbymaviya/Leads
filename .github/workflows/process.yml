name: LeadFinder AI - Global Web Dev Leads

on:
  workflow_dispatch:

jobs:
  leadfinder:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # North America
          - zone: us-pacific
            url: https://download.geofabrik.de/north-america/us-pacific-latest.osm.pbf
          - zone: us-northeast
            url: https://download.geofabrik.de/north-america/us-northeast-latest.osm.pbf
          - zone: us-south
            url: https://download.geofabrik.de/north-america/us-south-latest.osm.pbf
          - zone: canada
            url: https://download.geofabrik.de/north-america/canada-latest.osm.pbf

          # Europe
          - zone: Great Britain
            url: https://download.geofabrik.de/europe/great-britain-latest.osm.pbf
          - zone: germany
            url: https://download.geofabrik.de/europe/germany-latest.osm.pbf
          - zone: france
            url: https://download.geofabrik.de/europe/france-latest.osm.pbf

          # Asia & Oceania
          - zone: india-western
            url: https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf
          - zone: india-southern
            url: https://download.geofabrik.de/asia/india/southern-zone-latest.osm.pbf
          - zone: australia
            url: https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install osmium pymongo certifi phonenumbers

      - name: 🌍 Download ${{ matrix.zone }}
        run: |
          wget -O ${{ matrix.zone }}.osm.pbf ${{ matrix.url }}

      - name: 📂 Verify File
        run: |
          ls -lh ${{ matrix.zone }}.osm.pbf
          file ${{ matrix.zone }}.osm.pbf

      - name: 🚀 Run LeadFinder Parser
        env:
          PBF_FILE: ${{ matrix.zone }}.osm.pbf
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python app.py
